<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Explorer</title>
    <link rel="stylesheet" href="style.css">

</head>
<body class="characters-page">

        <header>
            <h1>Star Wars Explorer</h1>

            <nav>
                <a href="index.html">Characters</a>
                <a href="films.html">Films</a>
            </nav>
        </header>

        <main class="search-page">
            <h2>Characters</h2>

            <section>
                <input type="search" placeholder="Search characters..."
                autocomplete="off"
                >
            </section>

            <section id="list-container">
                <p id="loading" class="loading">Loading characters...</p>
            </section>

            <section id="pagination">
                <button id="previous-page">Previous</button>
                <span id="page-info"></span>
                <button id="next-page">Next</button>
            </section>
        </main>
        
    <script src="script.js"></script>

</body>
</html>
